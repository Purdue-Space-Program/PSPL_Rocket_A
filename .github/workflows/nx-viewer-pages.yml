name: Publish NX Viewer
on:
  push:
    branches: [main]
    paths:
      - 'nx-viewer/**'
      - '.github/workflows/nx-viewer-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nx-viewer-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nx-viewer
      - id: deployment
        uses: actions/deploy-pages@v4